name: ci
on:
  push: { branches: [main, dev] }
  pull_request: { branches: [main, dev] }

jobs:
  build:
    runs-on: ubuntu-24.04

    # bitnamilegacy/minio (not the official minio/minio image) runs correctly
    # from env vars alone -- official minio/minio needs a `server /data`
    # command argument that the services: block has no field to supply.
    # (Bitnami's free-tier images moved to the bitnamilegacy namespace in
    # 2025 -- plain bitnami/minio no longer resolves.)
    services:
      minio:
        image: bitnamilegacy/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000

    env:
      S3_TEST_ENDPOINT: http://localhost:9000
      S3_TEST_BUCKET: artifacts-test
      S3_TEST_ACCESS_KEY_ID: minioadmin
      S3_TEST_SECRET_ACCESS_KEY: minioadmin

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install
      - run: pnpm run format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck

      - name: Wait for MinIO
        run: until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done

      - run: pnpm turbo run test
      - run: pnpm turbo run test:integration
