name: lowercase-test

services:
  minio:
    image: bitnamilegacy/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9000/minio/health/live || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Only the Prisma CLI talks to this today -- nothing in the application
  # constructs a Postgres client yet. `prisma migrate dev` provisions a shadow
  # database on the same server, which the default superuser can do.
  postgres:
    image: postgres:16-alpine
    # Not 5432, and not 5433 either: a machine with native Postgres installs
    # can easily have both (an EnterpriseDB 15 and 16 side by side claim
    # exactly those two), and the failure reads as a Docker fault rather than a
    # port conflict. Override POSTGRES_HOST_PORT if 5434 is taken too, and set
    # POSTGRES_DATABASE_URL to match.
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: lcase
      POSTGRES_PASSWORD: lcase
      POSTGRES_DB: lcase
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lcase -d lcase"]
      interval: 5s
      timeout: 5s
      retries: 5
